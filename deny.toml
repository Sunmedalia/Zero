# cargo-deny policy: advisories, licenses, banned sources and duplicate crates.
# Run with: cargo deny --locked check

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # webpki-roots CA data
  "ISC",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
