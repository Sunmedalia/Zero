[package]
name = "zero-tui"
version = "0.1.7"
edition = "2024"
autobins = false
license = "MIT"
description = "Native Linux and Windows memory forensics terminal"

[[bin]]
name = "zero"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
memchr = "2"
pdb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
xpress-huffman = "=0.1.3"
xz2 = "0.1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
