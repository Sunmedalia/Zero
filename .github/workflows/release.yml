name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches package version
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/package version mismatch'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          version=${GITHUB_REF_NAME#v}
          archives=(
            "zero-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "zero-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "zero-${version}-aarch64-apple-darwin.tar.gz"
            "zero-${version}-x86_64-pc-windows-msvc.zip"
          )
          for archive in "${archives[@]}"; do
            test -f "$archive"
            cat "${archive}.sha256"
          done > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zero $GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md
