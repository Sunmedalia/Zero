[package]
name = "zero-tui"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Native Linux and Windows memory forensics terminal"

[[bin]]
name = "zero"
path = "src/bin/zero.rs"

[[bin]]
name = "zero-mcp"
path = "src/mcp.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1"
flate2 = "1"
memchr = "2"
pdb = "0.8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
xpress-huffman = "=0.1.3"
xz2 = "0.1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
