name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PCRE2_SYS_STATIC: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        shell: bash
        run: |
          rustup show
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Restore compiled artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: build-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}-
      - name: Check, test and build
        if: runner.os != 'Windows'
        run: make check
      - name: Build Windows release
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - name: Package and verify native release
        if: runner.os != 'Windows'
        run: |
          python3 -I scripts/package_release.py \
            --target '${{ matrix.target }}' --output dist
          python3 -I scripts/verify_release.py dist/*.tar.gz
      - name: Package and verify native Windows release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --only-binary=:all: pywinpty==3.1.2
          python -I scripts/package_release.py \
            --target '${{ matrix.target }}' --output dist
          python -I scripts/verify_release.py dist/*.zip
      - name: Clippy on Windows
        if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  supply-chain:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check
