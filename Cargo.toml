[package]
name = "zero-tui"
version = "0.2.6"
edition = "2024"
autobins = false
license = "MIT"
description = "Native Linux and Windows memory forensics terminal"

[[bin]]
name = "zero"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
capstone = { version = "=0.14.0", default-features = false, features = ["std", "full", "arch_x86"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
csv = "1"
des = "0.8"
flate2 = "1"
hmac = "0.12"
md-5 = "0.10"
memchr = "2"
pdb = "0.8"
pcre2-sys = "0.2.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
xpress-huffman = "=0.1.3"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
tar = { version = "0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
